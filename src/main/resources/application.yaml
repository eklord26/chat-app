ktor:
  development: true
  application:
        modules:
            - com.example.ApplicationKt.module
  deployment:
        port: 8080
        host: "0.0.0.0"
postgres:
  url: "jdbc:postgresql://localhost:5432/chatapp"
  user: postgres
  password: postgres
hash:
  defaultCost: 12
encryption:
  # Override in production with CHAT_APP_MASTER_KEY_BASE64 or this config value.
  # Must be a Base64 encoded 32-byte AES key.
  masterKeyBase64: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
design:
  colors:
    primary: "#008000"
    secondary: "#e7eef6"
    warning: "#a86f1d"
    error: "#c64646"
    success: "#17795f"
media:
  maxFileSizeMb: 30
  serverStorageLimitMb: 5120
  storagePath: "./uploads/media"
